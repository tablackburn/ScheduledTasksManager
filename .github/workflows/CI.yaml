name: CI

on:
  push:
    branches:
      - main
    paths:
      - '.actrc'
      - '.github/workflows/CI.yaml'
      - 'ScheduledTasksManager/**'
      - 'build.ps1'
      - 'build.psake.ps1'
      - 'build.depend.psd1'
      - 'tests/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: PSScriptAnalyzer Lint
    runs-on: windows-latest
    # Guard against a hung step burning the 6-hour default. The suite runs in
    # about 70 seconds. Two hazards this bounds: BuildHelpers' Invoke-Git calls
    # WaitForExit() before draining standard output, so a HEAD commit message
    # larger than the 4096-byte pipe buffer deadlocks with no output; and a test
    # that invokes a cmdlet with a missing mandatory parameter blocks forever on
    # the resulting prompt when the host looks interactive.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Lint through the build rather than calling Invoke-ScriptAnalyzer directly.
      #
      # The direct call passed -Settings PSGallery and analysed the source tree.
      # ./build.ps1 -Task Analyze uses this repository's
      # PSScriptAnalyzerSettings.psd1, which psake already points at, and
      # analyses the built module. Two rulesets over two different paths, so a
      # local run and this job disagreed: 1 finding here against 61 locally.
      #
      # The 61 are what this repository's own settings file asks for -- it turns
      # on the formatting rules PSScriptAnalyzer ships disabled, and nothing had
      # ever run them. They are warnings, and the build fails on Error, so this
      # reports them without turning the job red. Fixing them is a separate
      # change; 60 of the 61 are auto-fixable with Invoke-Formatter against this
      # same settings file.
      - name: Install dependencies
        shell: pwsh
        run: ./build.ps1 -Bootstrap -Task Init

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: ./build.ps1 -Task Analyze

  test:
    name: Unit Tests (windows-latest)
    runs-on: windows-latest
    # Guard against a hung step burning the 6-hour default. The suite runs in
    # about 70 seconds. Two hazards this bounds: BuildHelpers' Invoke-Git calls
    # WaitForExit() before draining standard output, so a HEAD commit message
    # larger than the 4096-byte pipe buffer deadlocks with no output; and a test
    # that invokes a cmdlet with a missing mandatory parameter blocks forever on
    # the resulting prompt when the host looks interactive.
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Cache PowerShell modules
        uses: actions/cache@v6
        with:
          path: ~/Documents/PowerShell/Modules
          key: ${{ runner.os }}-psmodules-${{ hashFiles('build.depend.psd1') }}
          restore-keys: |
            ${{ runner.os }}-psmodules-

      - name: Build Task - Test
        run: ./build.ps1 -Task 'Test' -Bootstrap

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: ${{ (success() || failure()) && !env.ACT }}
        with:
          name: test-results
          path: ./tests/out/testResults.xml
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: ${{ !env.ACT }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
